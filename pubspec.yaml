name: nepal_admin_api
description: Offline administrative divisions of Nepal — 7 provinces, 77 districts, 753 local bodies, 6,743 wards.
version: 2.10.0

homepage: https://namunaone.github.io/nGeo
repository: https://github.com/namunaONE/nGeo
issue_tracker: https://github.com/namunaONE/nGeo/issues

# NOTE: pub.dev only accepts topics from its fixed list (https://pub.dev/topics).
# If "nepal" is not recognized at publish time, remove it and keep the others.
topics:
  - nepal
  - geography
  - open-data

environment:
  sdk: ^3.0.0

# Pure Dart package: no runtime dependencies needed — the data ships in the box.
# Data license: boundary geometry is CC BY-IGO (Survey Department of Nepal
# via HDX COD-AB/COD-EM); other data fields are CC-BY-4.0 / MIT as documented
# in NOTICE and data/SOURCES.md. Package code is MIT (see LICENSE).
dev_dependencies:
  crypto: ^3.0.7 # tool/merge only (SHA-256 provenance verification); never imported by lib/
  lints: ^6.0.0
  test: ^1.25.0
