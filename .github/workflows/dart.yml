name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly provenance watch: catches upstream source drift before a merge run
    # does, instead of after.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      # The gate stays binary, but a bare "no" is useless for fixing it:
      # which file, which construct? On failure this re-runs the formatter
      # per file and attaches the exact dart-format diff to the run as
      # check annotations, so the offending lines are visible from the
      # Checks tab without needing log access.
      - name: Verify formatting (generated file excluded)
        run: |
          files=$(git ls-files '*.dart' | grep -v 'lib/src/nepal_data.dart')
          if dart format --output=none --set-exit-if-changed $files; then
            exit 0
          fi
          reported=0
          for f in $files; do
            if dart format --output=none --set-exit-if-changed "$f" >/dev/null 2>&1; then
              continue
            fi
            echo "not dart-format clean: $f"
            if [ "$reported" -lt 8 ]; then
              reported=$((reported + 1))
              # Format a copy in-place (inside the repo, so the package's
              # language version applies), then diff against the original.
              tmp=".fmt-check-tmp.dart"
              cp "$f" "$tmp"
              # A file dart format cannot parse makes it exit 65. Under the
              # step shell default `bash -e`, that unguarded call aborted this
              # loop right here and filed a bare, file-less "exit code 65" -
              # the exact silence this annotation loop exists to prevent.
              # Capture the formatter complaint and report it like a diff.
              if fmt_out="$(dart format "$tmp" 2>&1)"; then
                msg="$(diff -u "$f" "$tmp" | head -c 500 || true)"
              else
                msg="dart format could not process this file: ${fmt_out:0:400}"
              fi
              rm -f "$tmp"
              msg="${msg//%/%25}"
              msg="${msg//$'\r'/%0D}"
              msg="${msg//$'\n'/%0A}"
              echo "::error file=$f,title=Needs dart format::$msg"
            fi
          done
          exit 1
      - name: Regenerate dataset (validates JSON against official counts)
        run: dart run tool/generate.dart
      - name: Verify no codegen drift
        run: git diff --exit-code -- lib/src/nepal_data.dart
      - name: Regenerate website payload
        run: dart run tool/generate_explorer_data.dart
      - name: Verify no website data drift (docs must match the package)
        run: git diff --exit-code -- docs/data.json docs/district-elevation.json
      - name: Verify site URL hygiene
        run: |
          hits=$(grep -rn "Nepal-Local-Government-Data" docs README.md SECURITY.md CONTRIBUTING.md PUBLISHING.md pubspec.yaml bindings packages tool 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            while IFS= read -r line; do
              echo "::error::${line%%:*} still references the old repository name"
            done <<< "$hits"
            exit 1
          fi
      - name: Verify site truth (versions and stats)
        run: dart run tool/check_site_truth.dart
      - name: Regenerate design tokens (brand/tokens.json -> docs/brand-tokens.css)
        run: dart run tool/generate_design_tokens.dart
      - name: Verify no brand token drift (CSS is generated, never hand-edited)
        run: git diff --exit-code -- docs/brand-tokens.css
      - name: Regenerate CSV / GeoJSON / JS / Python bindings
        run: dart run tool/generate_bindings.dart
      - name: Verify no bindings drift
        run: git diff --exit-code -- bindings/
      - name: Regenerate palika boundaries (HDX COD-AB, Survey Department)
        run: dart run tool/generate_palika_boundaries_hdx.dart
      - name: Verify no palika boundary drift
        run: git diff --exit-code -- lib/src/geo/palika_boundaries.dart
      - name: Regenerate province boundaries (National Geoportal)
        run: dart run tool/generate_province_boundaries.dart
      - name: Verify no province boundary drift
        run: git diff --exit-code -- lib/src/geo/province_boundaries.dart
      - name: Regenerate district boundaries (77 districts)
        run: dart run tool/generate_district_boundaries.dart
      - name: Verify no district boundary drift
        run: git diff --exit-code -- lib/src/geo/district_boundaries.dart
      - name: Regenerate district elevation stats (Copernicus GLO-30)
        run: dart run tool/generate_district_elevation.dart
      - name: Verify no district elevation drift
        run: git diff --exit-code -- lib/src/geo/district_elevation.dart
      - name: Boundary join coverage gate
        run: dart run tool/check_boundary_join.dart
      - name: Boundary topology validation gate
        run: dart run tool/check_boundary_topology.dart
      - name: RFC 7946 conformance gate (WGS84 lon/lat, closed rings)
        run: dart run tool/check_rfc7946.dart
      # Same principle as the formatting gate above: a bare "N issues found"
      # is useless when the log is out of reach, so on failure the full
      # analyzer output is attached to the run's step summary - file, line
      # and rule, readable straight from the run page.
      - name: Analyze
        run: |
          rc=0
          dart analyze --fatal-infos >/tmp/analyze.log 2>&1 || rc=$?
          cat /tmp/analyze.log
          if [ $rc -ne 0 ]; then
            {
              echo '## dart analyze --fatal-infos'
              echo '```'
              cat /tmp/analyze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # The step summary needs the web UI; the same lines are also
            # emitted as check annotations so the failure stays readable
            # from the API alone.
            while IFS= read -r line; do
              case "$line" in
                'Analyzing'*|'Issues found'*|'') ;;
                *) echo "::error::${line//%/%25}" ;;
              esac
            done < /tmp/analyze.log
          fi
          exit $rc
      - name: Run tests
        run: dart test
      - name: Coverage report
        run: dart test --coverage=coverage && dart pub global activate coverage && dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      # The step above has always produced a report that nothing acted on.
      # `lib/` is dominated by lib/src/nepal_data.dart — a 1,396-line generated
      # literal that reports 100% on import — so averaging it in would show a
      # flattering ~98% and hide any regression in the hand-written API. This
      # applies the floor to hand-written lines only. `--check-ignore` matters:
      # without it, `// coverage:ignore-line` markers are silently not honored
      # and the single unexecutable line (an uninstantiable private constructor)
      # counts as a miss.
      # Coverage re-measure policy (2026-11-01): dart test --coverage can
      # drop tail-isolate hit maps when the runner is under load — observed
      # twice on workflow-only PRs (identical "uncovered" line sets that a
      # green main run had covered). Same law as the budgets gate: a missed
      # floor earns exactly ONE fresh full re-measure; the second verdict is
      # final and the floor itself is never relaxed.
      - name: Enforce the coverage floor (one re-measure on a miss)
        run: |
          set -euo pipefail
          if dart run tool/check_coverage.dart; then
            exit 0
          fi
          echo "::notice::coverage floor missed on the first measurement — re-measuring once (dart test --coverage can drop tail-isolate hits under load; the floor is never relaxed, only re-measured)."
          rm -rf coverage
          dart test --coverage=coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
          dart run tool/check_coverage.dart
      - name: Explorer smoke test (no browser, no npm deps)
        run: node docs/smoke.cjs
      - name: Bindings smoke test (executes the JS, parses CSV + GeoJSON)
        run: node bindings/verify_bindings.cjs

  # The Python binding cannot be exercised locally (the release machine has no
  # interpreter), so this is where it is first actually run. It imports the
  # package, walks the whole API and asserts the same numbers the Dart, JS and
  # CSV artifacts are held to.
  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Compile before importing, so a syntax error reports as a syntax error
      # rather than as a bare "cannot import name", which is how a generator
      # defect once hid here for two runs.
      - name: Byte-compile the package
        working-directory: bindings/python
        run: python -m compileall -q nepal_admin
      - name: Import the package
        working-directory: bindings/python
        run: |
          python -c "import nepal_admin as n; print('imported', n.__version__)"
      - name: Run the module entry point
        working-directory: bindings/python
        run: python -m nepal_admin | head -5
      - name: Exercise the full API and assert the numbers
        working-directory: bindings/python
        run: |
          python - <<'PY'
          import nepal_admin as n

          s = n.get_national_stats()
          assert (s["provinces"], s["districts"], s["total"]) == (7, 77, 753), s
          assert (s["metro"], s["sub_metro"]) == (6, 11), s
          assert (s["municipalities"], s["rural_municipalities"]) == (276, 460), s
          assert s["wards"] == 6743, s
          assert s["verified_wards"] == 6697, s
          assert s["ward_gaps"] == 8, s
          assert s["unreconciled_wards"] == 46, s

          assert len(n.get_local_bodies_with_code()) == 753
          assert len(n.get_verified_local_bodies()) == 548
          assert len(n.get_single_source_local_bodies()) == 205
          assert len(n.get_uncoded_local_bodies()) == 0
          assert len(n.get_mappable_local_bodies()) == 753

          b = n.get_local_body_by_cbs(31304)
          assert b["name"] == "Bharatpur" and b["district"] == "Chitwan", b
          assert b["nameNe"], "Bharatpur must carry a Devanagari name"
          assert n.get_local_body_by_cbs(99999) is None
          # A single-source code is reachable but not by the strict lookup.
          assert n.get_local_body_by_cbs(40504)["name"] == "Pokhara"
          assert n.get_local_body_by_cbs_verified(40504) is None

          assert n.get_province_by_id("bagmati")["name"] == "Bagmati"
          assert n.get_province_by_id("NP-P3")["id"] == "bagmati"
          assert n.get_district_by_cbs(306)["name"] == "Kathmandu"
          assert n.get_district_by_name("Chitwan")["headquarter"] == "Bharatpur"

          # Bilingual search, both directions.
          en = n.search("Bharatpur")["localBodies"]
          ne = n.search(b["nameNe"])["localBodies"]
          assert ne and len(ne) == len(en), (len(ne), len(en))
          assert len(n.search("जकजकजक")["localBodies"]) == 0

          # Duplicate-name disambiguation and the null-on-ambiguity rule.
          assert len(n.get_local_bodies_by_name("Sunkoshi", "Okhaldhunga")) == 1
          assert n.get_local_body_by_full_path("Bharatpur, Chitwan, Bagmati")
          assert n.get_local_body_by_full_path("Sunkoshi") is None

          # Ward reconciliation.
          assert n.get_province_stats("lumbini")["wards_reconcile"] is True
          assert n.get_province_stats("gandaki")["unreconciled_wards"] == 14

          print("PYTHON BINDINGS OK")
          PY

  # example/brand_theme.dart imports package:flutter/material.dart, so plain
  # `dart analyze` excludes it. Without this job it is the only Dart file in the
  # repo that nothing ever compiles, and it would rot silently.
  flutter-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # `flutter-version` and `channel` are mutually exclusive inputs, and
          # `flutter-version` wants a semver, not the string "stable". Passing
          # both made this job fail inside the action itself, which is why it
          # had never once run successfully.
          channel: stable
      - name: Compile-check the Flutter example
        run: |
          set -euo pipefail
          # example/ is deliberately NOT a package. Giving it a pubspec makes
          # the root `dart pub get` cascade into it, and `test` and
          # `publish-dry-run` install no Flutter SDK, so both would then fail
          # resolving a Flutter dependency they do not need. And `dart analyze`
          # from the root cannot resolve package:flutter at all, because the
          # root package has no Flutter dependency. So the job builds a
          # throwaway package around the files and compiles them there.
          work="$(mktemp -d)"
          cat > "$work/pubspec.yaml" <<EOF
          name: example_check
          description: Throwaway package that compiles the example/ files.
          publish_to: none
          environment:
            sdk: ^3.0.0
            flutter: ">=3.10.0"
          dependencies:
            flutter:
              sdk: flutter
            nepal_admin_api:
              path: $GITHUB_WORKSPACE
          dev_dependencies:
            flutter_lints: ^6.0.0
          flutter:
            uses-material-design: true
          EOF
          mkdir -p "$work/lib"
          cp example/*.dart "$work/lib/"
          cd "$work"
          flutter pub get
          flutter analyze --fatal-infos

  # packages/nepal_admin_widgets. It is a Flutter package that depends on the
  # PUBLISHED nepal_admin_api (^2.7.2 — the constraint it ships against), so
  # `dart analyze`/`dart test` in the root job do not cover it — without this
  # job every line of it would be unverified, which is exactly the rot this
  # repo exists to avoid.
  flutter-widgets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nepal_admin_widgets
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # See the note in the flutter-example job: `channel` alone.
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze library, example and tests
        run: flutter analyze --fatal-infos
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Run widget tests
        run: flutter test

  # Scheduled integrity watch.
  #
  # Two checks, because they answer different questions and only one of them
  # can actually run here:
  #
  #   1. The pinning CONTRACT: is data/PROVENANCE.sha256 well-formed, are its
  #      paths safe and unique, and is every vendored source documented in
  #      data/SOURCES.md? This needs no payload and always runs.
  #
  #   2. The PAYLOAD: does each vendored input still hash to its recorded
  #      value? This needs data/_raw/, which is deliberately gitignored (~2.5 MB
  #      of CC-BY snapshots) and therefore absent from every CI checkout.
  #
  # The previous version ran check 2 unconditionally and filed
  # "[provenance] vendored source drift detected" on failure — i.e. it blamed
  # upstream for the condition "we chose not to commit the snapshots", on every
  # scheduled run, forever. It never fired only because the job had never
  # actually executed. The two conditions are now distinct, and the tool's
  # exit code says which one happened:
  #   0 verified   1 drift/invalid   2 sources absent (expected here)
  provenance-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Audit the provenance contract
        run: dart run tool/merge/verify_provenance.dart --manifest

      - name: Verify the vendored inputs, if they are present
        id: provenance
        continue-on-error: true
        run: |
          # Exit 0, not the tool's exit 2: with `continue-on-error: true` any
          # non-zero exit sets `outcome: failure`, which is the very condition
          # that files the issue below. Absent sources must pass quietly.
          if [ ! -d data/_raw ]; then
            echo "::notice::data/_raw is not in this checkout (gitignored by"
            echo "::notice::design - see data/SOURCES.md). Payload hashes cannot"
            echo "::notice::be checked here; the contract audit above still ran."
            echo "::notice::This is NOT upstream drift."
            exit 0
          fi
          dart run tool/merge/verify_provenance.dart

      - name: File an issue when upstream genuinely drifted
        if: steps.provenance.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = 'The scheduled provenance check failed: at least one '
              + 'vendored input in `data/_raw/` no longer matches its SHA-256 '
              + 'pin in `data/PROVENANCE.sha256`, or is missing.\n\n'
              + 'An upstream source has changed. Do NOT re-run the merge to '
              + 'paper over it — follow the guidance in `data/SOURCES.md` '
              + '(re-fetch, re-review, re-pin, then re-merge).\n\n'
              + 'See the failing run logs for the specific file.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[provenance] vendored source drift detected',
              body,
              labels: ['data'],
            });

  publish-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Publish dry-run (no upload)
        run: dart pub publish --dry-run

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # The CSV and GeoJSON live under bindings/ (excluded from the published
      # Dart package), but the docs site is the natural download surface for
      # people who want to open them in pandas or QGIS. Copy them into the
      # Pages artifact at build time rather than duplicating them in the repo.
      - name: Stage downloadable data files for the site
        run: |
          mkdir -p docs/downloads
          cp bindings/csv/*.csv docs/downloads/
          cp bindings/geojson/*.geojson docs/downloads/
          cp bindings/meta.json docs/downloads/
      # Wave 4 PR B (payload diet): docs/palika-boundaries-highres.geojson is
      # the ~40 MB full-resolution source-of-truth for the boundaries package
      # and its generators — NOT a website asset. The explorer serves the
      # 476 KB working set plus the 3.2 MB high-detail variant; the full file
      # ships as a GitHub Release asset (release-geojson.yml) instead.
      - name: Keep the full-resolution source out of the site artifact
        run: rm -f docs/palika-boundaries-highres.geojson
      # The size budget is a feature: nothing heavier than this may leak
      # into docs/ unnoticed. Baseline after the diet: ~7.3 MB; the 9 MB
      # ceiling carries headroom for the data files staged above.
      - name: Enforce the site artifact size budget
        run: |
          max=$((9*1024*1024))
          bytes=$(du -sb docs/ | cut -f1)
          echo "site artifact: $((bytes/1024/1024)) MB ($bytes bytes); budget: 9 MB"
          if [ "$bytes" -gt "$max" ]; then
            echo "::error::site artifact $((bytes/1024/1024)) MB exceeds the 9 MB budget — something heavy leaked into docs/"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4