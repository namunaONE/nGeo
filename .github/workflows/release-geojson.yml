name: Release full-resolution geojson

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-geojson.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The ~40 MB full-resolution palika boundary source stays in the repo
      # (source-of-truth input for the boundaries package and its generators)
      # but is kept out of the Pages artifact — the explorer serves the
      # 476 KB working set plus the 3.2 MB high-detail variant. This job
      # publishes the full file as a Release asset so it stays a one-click
      # download. Idempotent: --clobber re-uploads in place.
      #
      # Truthfulness (2026-11-01): the release notes are REFRESHED on every
      # run, not just at creation. The first release was created while the
      # file's lineage was sthaniya.gov.np; after the v2.10.0 HDX COD-AB
      # migration the notes kept describing the superseded lineage — a
      # misdescription of a publicly redistributed CC BY-IGO asset. gh
      # release edit with the current sha keeps the description and the
      # bytes always in agreement. Idempotent under --clobber re-runs;
      # the sha256 in the notes always matches the uploaded asset.
      # PMTiles (2026-11-01): the same boundaries archived as one
      # single-file PMTiles, so map renderers can stream the tiles
      # without a tile server. Built in the SAME job on purpose - one
      # notes edit, no second workflow racing the release. tippecanoe
      # (conda-forge, pinned) tiles the GeoJSON; protomaps/go-pmtiles
      # (the documented Docker invocation,
      # docs.protomaps.com/pmtiles/cli) converts the mbtiles; the
      # archive uploads to the SAME Release tag, NEVER to the Pages
      # artifact (the payload-diet law stands).
      - name: Install tippecanoe (conda-forge, pinned)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: tippecanoe
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            tippecanoe=2.79.0
      - name: Upload the full-resolution palika boundaries as a Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="palika-boundaries-highres"
          file="docs/palika-boundaries-highres.geojson"
          [ -f "$file" ] || { echo "::error::$file is missing"; exit 1; }
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          tippecanoe -zg -o palika-boundaries.mbtiles "$file"
          docker run -v "$PWD":/data --rm protomaps/go-pmtiles convert \
            /data/palika-boundaries.mbtiles /data/palika-boundaries.pmtiles
          psha=$(sha256sum palika-boundaries.pmtiles | cut -d' ' -f1)
          notes="Full-resolution palika (local body) boundaries for all 753 local bodies. Generated by tool/generate_palika_boundaries_hdx.dart from HDX COD-AB v02 (Survey Department of Nepal + UN RCO, CC BY-IGO 3.0 — attribution in NOTICE §4). Protected areas excluded to a separate overlay. The same bytes CI regenerates and verifies. Also published as palika-boundaries.pmtiles - the same boundaries as a single-file PMTiles archive (tippecanoe 2.79.0, protomaps/go-pmtiles) for streaming map renderers. sha256: $sha (geojson), $psha (pmtiles)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Palika boundaries — full resolution" \
              --notes "$notes"
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          gh release upload "$tag" "$file" palika-boundaries.pmtiles \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice::release $tag assets + notes refreshed (geojson $sha, pmtiles $psha)"
