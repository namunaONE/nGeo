name: District elevation stats (GLO-30)

# Rebuilds bindings/geojson/districts.elevation.geojson from Copernicus
# GLO-30 and commits it when it changes. No cron trigger: GLO-30 is the
# frozen 2021 release - the DEM never drifts upstream, so the only
# reasons to rebuild are a tool change or the district polygons changing.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tool/elevation/**'
      - '.github/workflows/elevation-stats.yml'
      - 'docs/district-boundaries.geojson'

permissions:
  contents: write

concurrency:
  group: elevation-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the raster stack
        run: pip install rasterio rasterstats shapely numpy
      # The step summary exists so a failure is readable without log
      # access: the run page renders $GITHUB_STEP_SUMMARY anonymously.
      - name: Compute zonal stats and run the anchor gates
        run: |
          set -o pipefail
          python tool/elevation/build_elevation_stats.py 2>&1 | tee elevation-build.log
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -ne 0 ]; then
            {
              echo '## Elevation build failed - last tool output'
              echo '```'
              tail -c 6000 elevation-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
      # The artifact is text (~15 KB) and is generated in CI only - it is
      # committed, never hand-edited, so every published byte has a
      # gate-verified, provenance-pinned build behind it. [skip ci] keeps
      # the bot commit from re-triggering the workflow suite.
      - name: Commit when the artifact changed
        run: |
          set -o pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bindings/geojson/districts.elevation.geojson
          if git diff --cached --quiet; then
            echo 'districts.elevation.geojson unchanged - nothing to commit.'
          else
            git commit -m 'data: rebuild district elevation stats (GLO-30) [skip ci]'
            git push 2>&1 | tee commit-push.log || {
              {
                echo '## git push failed'
                echo '```'
                cat commit-push.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
          fi
