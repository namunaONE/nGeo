# TEMPORARY branch helper - mirrors the PR #6 precedent: run dart format
# and the generators on CI, commit the derived artifacts, and dispatch the
# Dart CI gate on the updated head, so the PR runs against a consistent
# tree. This file is deleted before the squash-merge.
name: Branch regen (temporary)

on:
  push:
    branches: [fix/highres-boundaries-ci-green]

permissions:
  contents: write
  actions: write

concurrency:
  group: branch-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: dart format (same file set as the CI gate)
        run: |
          set +e
          files=$(git ls-files '*.dart' | grep -v 'lib/src/nepal_data.dart')
          dart format $files >/tmp/fmt.log 2>&1
          rc=$?
          cat /tmp/fmt.log
          if [ $rc -ne 0 ]; then
            echo "::error::dart format exited $rc: $(tail -c 400 /tmp/fmt.log | tr '\n' ' ')"
            echo "fmt_rc=1" >> "$GITHUB_ENV"
          else
            echo "fmt_rc=0" >> "$GITHUB_ENV"
          fi

      - name: Regenerate high-res palika boundaries
        run: |
          set +e
          dart run tool/generate_palika_boundaries_highres.dart >/tmp/gen1.log 2>&1
          rc=$?
          cat /tmp/gen1.log
          if [ $rc -ne 0 ]; then
            echo "::error::palika highres regen exited $rc: $(tail -c 500 /tmp/gen1.log | tr '\n' ' ')"
            echo "gen1_rc=1" >> "$GITHUB_ENV"
          else
            echo "gen1_rc=0" >> "$GITHUB_ENV"
          fi

      - name: Regenerate province boundaries
        run: |
          set +e
          dart run tool/generate_province_boundaries.dart >/tmp/gen2.log 2>&1
          rc=$?
          cat /tmp/gen2.log
          if [ $rc -ne 0 ]; then
            echo "::error::province regen exited $rc: $(tail -c 500 /tmp/gen2.log | tr '\n' ' ')"
            echo "gen2_rc=1" >> "$GITHUB_ENV"
          else
            echo "gen2_rc=0" >> "$GITHUB_ENV"
          fi

      - name: Commit formatted and regenerated artifacts
        id: commitpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tree already consistent; nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "style: dart-format and regenerate canonical high-res boundaries (temporary branch regen)"
            git pull --rebase origin fix/highres-boundaries-ci-green
            git push origin HEAD:fix/highres-boundaries-ci-green
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Dart CI gate on the updated head
        if: env.fmt_rc == '0' && env.gen1_rc == '0' && env.gen2_rc == '0'
        run: |
          set +e
          code=$(curl -s -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/namunaONE/nGeo/actions/workflows/dart.yml/dispatches \
            -d '{"ref":"fix/highres-boundaries-ci-green"}')
          if [ "$code" != "204" ]; then
            echo "::error::workflow dispatch failed (HTTP $code): $(head -c 300 /tmp/dispatch.out)"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Diagnostics go two places: the step summary, and the raw logs
      # pushed to the ci-diagnostics branch. The run page truncates and
      # log access is unavailable from outside, so the side branch is the
      # readable copy. Pushing a different ref with GITHUB_TOKEN triggers
      # no workflows, so this cannot loop.
      - name: Diagnostics - analyze, tests, join gate
        run: |
          set +e
          dart analyze --fatal-infos >/tmp/analyze.log 2>&1
          arc=$?
          cat /tmp/analyze.log
          dart test >/tmp/test.log 2>&1
          trc=$?
          tail -c 3000 /tmp/test.log
          dart run tool/check_boundary_join.dart >/tmp/join.log 2>&1
          jrc=$?
          cat /tmp/join.log
          {
            echo '## Diagnostics'
            echo '### dart analyze (exit '"$arc"')'
            echo '```'
            cat /tmp/analyze.log
            echo '```'
            echo '### dart test, tail (exit '"$trc"')'
            echo '```'
            tail -c 3000 /tmp/test.log
            echo '```'
            echo '### boundary join gate (exit '"$jrc"')'
            echo '```'
            cat /tmp/join.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ci-diagnostics
          cp /tmp/analyze.log /tmp/test.log /tmp/join.log ci-diagnostics/
          printf 'arc=%s\ntrc=%s\njrc=%s\n' "$arc" "$trc" "$jrc" > ci-diagnostics/exits.txt
          git add ci-diagnostics
          if git diff --cached --quiet; then
            echo "diagnostics unchanged; not pushing"
          else
            git commit -m "chore: publish diagnostics logs"
            git push origin HEAD:refs/heads/ci-diagnostics --force
          fi
          if [ $((arc + trc + jrc)) -ne 0 ]; then exit 1; fi
