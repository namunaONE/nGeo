name: CI Diagnostics
on:
  push:
    branches: [feat/district-boundaries]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Format diff capture
        run: |
          files=$(git ls-files '*.dart' | grep -v 'lib/src/nepal_data.dart')
          dart format --output=none --set-exit-if-changed $files > /tmp/fmt.log 2>&1 || true
          cat /tmp/fmt.log
          dart format $files > /dev/null 2>&1
          git diff > /tmp/fmtdiff.log
          git checkout -- .
          cat /tmp/fmtdiff.log
      - name: Publish logs to ci-diagnostics
        run: |
          mkdir -p ci-diagnostics
          cp /tmp/fmt.log /tmp/fmtdiff.log ci-diagnostics/
          git config user.name ci-diagnostics
          git config user.email ci@users.noreply.github.com
          git add ci-diagnostics
          git commit -m 'diagnostics [skip ci]' --allow-empty
          git push origin HEAD:refs/heads/ci-diagnostics --force
