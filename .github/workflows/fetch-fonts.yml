name: Fetch design fonts

# Wave 1.3 - self-hosted typography. The four pages no longer load
# Google Fonts; every glyph the site needs is served from this repo.
# The woff2 binaries are BORN IN CI (never hand-pushed - the connector
# corrupts binaries) and committed by the bot, the same pattern as the
# terrain archives in nepaverse.
#
# Budget: all fonts together must stay <= 180 KiB (docs/fonts total).
# Current set: 173,556 bytes.
#   Inter variable (latin, one file for every weight)     48,256
#   Noto Sans Devanagari 400 + 600                        103,132
#   JetBrains Mono 400 (500 use falls back to 400)         21,168
# To bump a version: change the pin in the curl line below and push
# this file (the paths filter re-triggers this workflow), or use
# workflow_dispatch.

on:
  push:
    paths:
      - '.github/workflows/fetch-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-fonts
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned woff2 files (jsDelivr @fontsource)
        run: |
          set -euo pipefail
          mkdir -p docs/fonts
          curl -fsSL -o docs/fonts/inter-latin-wght-normal.woff2 "https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/files/inter-latin-wght-normal.woff2"
          curl -fsSL -o docs/fonts/noto-sans-devanagari-devanagari-400-normal.woff2 "https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-devanagari@5.3.0/files/noto-sans-devanagari-devanagari-400-normal.woff2"
          curl -fsSL -o docs/fonts/noto-sans-devanagari-devanagari-600-normal.woff2 "https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-devanagari@5.3.0/files/noto-sans-devanagari-devanagari-600-normal.woff2"
          curl -fsSL -o docs/fonts/jetbrains-mono-latin-400-normal.woff2 "https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-400-normal.woff2"
      - name: Verify woff2 magic bytes + size budget (<= 180 KiB total)
        run: |
          set -euo pipefail
          total=0
          for f in docs/fonts/*.woff2; do
            magic=$(head -c4 "$f")
            if [ "$magic" != "wOF2" ]; then
              echo "::error file=$f::not a woff2 file (magic $magic)"
              exit 1
            fi
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            total=$((total + size))
          done
          echo "total: $total bytes"
          if [ "$total" -gt 184320 ]; then
            echo "::error::font budget blown: $total bytes > 184320 (180 KiB). Slim the set or subset."
            exit 1
          fi
      - name: Write the sha256 manifest
        run: |
          set -euo pipefail
          (cd docs/fonts && sha256sum *.woff2 > fonts.sha256)
          cat docs/fonts/fonts.sha256
      - name: Commit fonts (binaries are born in CI)
        run: |
          set -euo pipefail
          git config user.name "ngeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/fonts
          if git diff --cached --quiet; then
            echo "fonts unchanged - nothing to commit"
          else
            git commit -m "fonts: fetch pinned self-hosted woff2 (Inter variable, Noto Sans Devanagari 400/600, JetBrains Mono 400) [skip ci]"
            git push
          fi
