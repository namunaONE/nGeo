# Temporary: regenerates the derived artifacts on this branch so PR CI runs
# against a consistent tree. Delete before merge.
name: Regen artifacts (temporary)

on:
  push:
    branches: [data/nepal-post-code-adjudication-2026-10-25]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Regenerate package dataset
        run: dart run tool/generate.dart
      - name: Regenerate website payload
        run: dart run tool/generate_explorer_data.dart
      - name: Regenerate bindings
        run: dart run tool/generate_bindings.dart
      - name: Regenerate palika boundaries module
        run: dart run tool/generate_palika_boundaries.dart
      - name: Commit and push regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib docs/data.json bindings
          git diff --cached --quiet && echo "nothing to regenerate" && exit 0
          git commit -m "chore: regenerate artifacts from adjudicated dataset"
          git push
