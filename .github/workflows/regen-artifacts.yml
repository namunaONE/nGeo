# TEMPORARY regen workflow for the centroid-completion PR.
# Regenerates the derived artifacts on this branch and commits them, so
# the PR carries the regenerated outputs the CI drift gates expect.
# Delete before merge (same pattern as PR #6).
name: Regen artifacts (temporary)

on:
  push:
    branches: [data/complete-palika-centroids]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/generate.dart
      - run: dart run tool/generate_explorer_data.dart
      - run: dart run tool/generate_bindings.dart
      - run: dart run tool/generate_palika_boundaries.dart
      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/nepal_data.dart docs/data.json bindings/ lib/src/geo/palika_boundaries.dart
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: regenerate derived artifacts for centroid completion"
          git push
